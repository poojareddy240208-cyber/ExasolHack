name: OmniSync CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Code Quality & OCC Concurrency Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend frontend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max complexity 10, line-length 120
          flake8 backend frontend tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Format check with Black
        run: |
          black --check --line-length 120 backend frontend tests

      - name: Run Pytest Race Condition & Concurrency Suite
        run: |
          pytest tests/ -v --durations=10
