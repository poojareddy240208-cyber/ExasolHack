version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 15+ (Transactional Database - OLTP)
  # Role: Product catalog, checkout ledgers, and strict OCC concurrency enforcement.
  # Schema must enforce CHECK (stock >= 0) constraint.
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: omnisync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnisync_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omnisync_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnisync} -d ${POSTGRES_DB:-omnisync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnisync_network

  # ============================================================================
  # 2. Redis 7 Alpine (In-Memory Event Cache & Celery Broker)
  # Role: Live 5-minute rolling cart velocity tracking and Celery task broker.
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: omnisync_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnisync_network

  # ============================================================================
  # 3. Exasol Personal Edition (Analytics Database - OLAP / "The Brain")
  # Role: High-performance in-memory analytics, Python UDFs (LightGBM, PyTorch),
  # native JSON Golden Record storage, and BucketFS weight hosting.
  # NOTE: Exasol container MUST run with privileged: true and requires >=8GB host RAM.
  # ============================================================================
  exasol:
    image: exasol/docker-db:latest
    container_name: omnisync_exasol
    restart: unless-stopped
    privileged: true
    stop_grace_period: 120s
    environment:
      - EXA_PARAMS=-overrideSessionLimits -memsize=4096M
    ports:
      - "${EXASOL_PORT:-8563}:8563"
      - "${EXASOL_BUCKETFS_PORT:-2580}:2580"
    volumes:
      - exasol_data:/exa/data
    networks:
      - omnisync_network

  # ============================================================================
  # 4. FastAPI Backend Application (API Gateway)
  # Role: High-throughput API routing, OCC checkout, and asynchronous webhook ingestion.
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnisync_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      exasol:
        condition: service_started
    networks:
      - omnisync_network

  # ============================================================================
  # 5. Celery Worker
  # Role: Asynchronously consumes Zendesk webhooks from Redis queue, ingests
  # ticket texts into Exasol, and runs in-database NLP churn classification.
  # ============================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnisync_celery_worker
    restart: unless-stopped
    command: celery -A backend.celery_app.celery worker --loglevel=info --concurrency=4
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      exasol:
        condition: service_started
    networks:
      - omnisync_network

  # ============================================================================
  # 6. Celery Beat Scheduler
  # Role: Periodic orchestrator triggering Exasol-to-Postgres EXPORT INTO JDBC
  # synchronization (predictive virtual safety stock & pre-computed return risk levels).
  # ============================================================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnisync_celery_beat
    restart: unless-stopped
    command: celery -A backend.celery_app.celery beat --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - omnisync_network

  # ============================================================================
  # 7. Streamlit Frontend (Customer Success & Analytics Dashboard)
  # Role: Internal visual console for Golden Record search, OCC inventory monitor,
  # return risk policy simulation, and VIP churn early warning.
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: omnisync_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    depends_on:
      - api
    networks:
      - omnisync_network

networks:
  omnisync_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  exasol_data:
